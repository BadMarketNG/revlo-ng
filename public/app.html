<meta name="description" content="Revlo.ng is Nigeria's accountless publishing platform. Share your story anonymously — no signup, no passwords. Posts expire automatically. Publicity without identity.">

<style>
html,body{margin:0;padding:0;background:#f5f6f7}
#root{min-height:100vh}
/* Keep feed cards prominent and balanced instead of pinning a lone post left. */
main>div[style*="grid-template-columns"]{
  grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),600px))!important;
  justify-content:center!important;
  row-gap:22px!important;
}
.revlo-view-progress{
  height:7px;
  overflow:hidden;
  background:rgba(126,143,135,.22);
  border-top:1px solid rgba(126,143,135,.2);
  border-bottom:1px solid rgba(126,143,135,.2);
}
.revlo-view-progress__fill{
  width:0;
  height:100%;
  background:linear-gradient(90deg,#28ba50,#8adf91);
  transform-origin:left center;
  transform:scaleX(0);
  transition:transform 90ms linear;
}
@media(prefers-reduced-motion:reduce){.revlo-view-progress__fill{transition:none}}
@media(max-width:640px){
  main>div[style*="grid-template-columns"]{
    grid-template-columns:minmax(0,1fr)!important;
  }
}
</style>
</head><body><div id="root"></div><script src="/revlo-theme.js" defer></script><script src="/revlo-ui.js" defer></script><script src="/revlo-presence.js" defer></script><script src="/revlo-features.js" defer></script><script src="/revlo-app.js" defer></script><script src="/revlo-view-tracker.js" defer></script><script src="/revlo-footer.js" defer></script><script src="/revlo-duration-lock.js" defer></script><script src="/revlo-card-expand.js" defer></script></body></html>
