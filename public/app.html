<style>
html,body{margin:0;padding:0;background:#f5f6f7}
#root{min-height:100vh}
/* Keep feed cards prominent and balanced instead of pinning a lone post left. */
main>div[style*="grid-template-columns"]{
  grid-template-columns:minmax(0,min(100%,680px))!important;
  justify-content:center!important;
  row-gap:22px!important;
}
body.revlo-two-column main>div[style*="grid-template-columns"]{
  grid-template-columns:repeat(2,minmax(0,1fr))!important;
  max-width:1180px;
  margin-left:auto;
  margin-right:auto;
  column-gap:24px!important;
  row-gap:28px!important;
}
.revlo-layout-toggle{display:inline-flex;gap:3px;padding:3px;border:1px solid #d7dcd8;border-radius:999px;background:#fff}
.revlo-layout-toggle button{border:0;border-radius:999px;background:transparent;color:#5e675f;padding:8px 11px;font:750 12px/1 system-ui;cursor:pointer}
.revlo-layout-toggle button.active{background:#1B5E20;color:#fff;box-shadow:0 2px 7px #1b5e2030}
.revlo-view-progress{
  height:7px;
  overflow:hidden;
  background:rgba(126,143,135,.22);
  border-top:1px solid rgba(126,143,135,.2);
  border-bottom:1px solid rgba(126,143,135,.2);
}
.revlo-view-progress__fill{
  width:0;
  height:100%;
  background:linear-gradient(90deg,#28ba50,#8adf91);
  transform-origin:left center;
  transform:scaleX(0);
  transition:transform 90ms linear;
}
@media(prefers-reduced-motion:reduce){.revlo-view-progress__fill{transition:none}}
@media(max-width:640px){
  main>div[style*="grid-template-columns"]{
    grid-template-columns:minmax(0,1fr)!important;
  }
  body.revlo-two-column main>div[style*="grid-template-columns"]{grid-template-columns:minmax(0,1fr)!important}
  .revlo-layout-toggle{width:100%;justify-content:center;margin-top:8px}
}
</style>
