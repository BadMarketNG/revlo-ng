<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Please pause · Revlo.ng</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <style>
    :root{color-scheme:light dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4f7f4;color:#142218}
    main{width:min(100%,520px);padding:38px 34px;border:1px solid #dbe6dc;border-radius:26px;background:#fff;box-shadow:0 24px 70px rgba(24,73,37,.13);text-align:center}
    .mark{display:grid;place-items:center;width:64px;height:64px;margin:0 auto 20px;border-radius:20px;background:#e9f7ec;color:#176b2a;font-size:30px;font-weight:900}
    h1{margin:0;font-size:clamp(28px,7vw,38px);letter-spacing:-.035em}
    p{margin:14px auto 0;max-width:400px;color:#5a665d;font-size:16px;line-height:1.55}
    .countdown{margin:28px 0 10px;color:#176b2a;font:900 clamp(44px,13vw,68px)/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:-.06em}
    .caption{margin:0;color:#748078;font-size:13px}
    @media(prefers-color-scheme:dark){body{background:#0b1220;color:#f8fafc}main{background:#111827;border-color:#334155;box-shadow:0 24px 70px rgba(0,0,0,.35)}.mark{background:#14351f;color:#7ee294}p,.caption{color:#cbd5e1}.countdown{color:#75dc8b}}
  </style>
  <script src="/revlo-cooldown.js" defer></script>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">!</div>
    <h1>Please slow down</h1>
    <p>This page was refreshed repeatedly in a short time. Revlo has paused access briefly to protect the service and your activity.</p>
    <div id="revlo-cooldown-countdown" class="countdown" role="timer" aria-live="polite">--:--</div>
    <p class="caption">This page will return to Revlo automatically when the countdown ends.</p>
  </main>
</body>
</html>
